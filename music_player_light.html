<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Music Player (Lite)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #222;
            --player-bg: #1a1a1a;
            --text-main: #fff;
            --text-sub: #aaa;
            --accent: #1DB954;
            --border: #333;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-sub);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #music-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            font-family: var(--font-stack);
            filter: drop-shadow(var(--shadow));
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        #music-player.hidden {
            transform: translateX(calc(-100% + 40px));
        }

        .player-body {
            background: var(--player-bg);
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 40px 0 0 40px;
            padding: 8px 15px 8px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 56px;
            box-sizing: border-box;
        }

        #album-art {
            width: 40px; height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 120px;
            line-height: 1.2;
            overflow: hidden;
            position: relative;
        }

        #track-title {
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            display: inline-block;
            flex-shrink: 0;
        }
        
        #track-title.overflowing {
            animation: scroll-back-forth 5s ease-in-out infinite alternate;
            padding-right: 0;
        }
        
        @keyframes scroll-back-forth {
            0%, 15% { transform: translateX(0); }
            85%, 100% { transform: translateX(var(--overflow-width, -10px)); }
        }

        #track-artist {
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 5px;
        }

        button {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 0;
            width: 30px; height: 30px;
            font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s, transform 0.1s;
        }
        button:hover { color: var(--text-main); }
        button:active { transform: scale(0.95); }
        
        #btn-play {
            color: var(--text-main);
            font-size: 1rem;
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            border: 1px solid transparent;
        }
        #btn-play:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }
        
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 50px;
            cursor: pointer;
            margin-left: 5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 3px;
            background: #444;
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px; width: 10px;
            border-radius: 50%;
            background: var(--text-main);
            margin-top: -3.5px;
        }

        #toggle-btn {
            background: var(--player-bg);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 40px 40px 0;
            height: 56px;
            width: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            padding-right: 2px;
            color: var(--accent);
        }
        #toggle-btn:hover { background: rgba(255,255,255,0.05); }

        #playlist-modal {
            position: absolute;
            bottom: 70px; left: 0;
            width: 260px;
            background: var(--player-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 0;
            display: none;
            box-shadow: var(--shadow);
            max-height: 200px;
            overflow-y: auto;
        }
        #playlist-modal.show { display: block; }

        #playlist-list {
            counter-reset: track-counter;
        }

        .p-item {
            font-size: 0.85rem;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: background 0.2s;
            counter-increment: track-counter;
            position: relative;
            overflow: hidden;
        }
        
        .p-item-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.25);
            z-index: 1;
            transition: filter 0.3s;
        }

        .p-item:hover .p-item-bg {
            filter: brightness(0.4);
        }

        .p-item.active .p-item-bg {
            filter: brightness(0.5);
        }
        
        .p-item-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            width: 100%;
            box-sizing: border-box;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        .p-item-counter::before {
            content: counter(track-counter) ".";
            font-size: 0.75rem;
            color: #ddd;
            min-width: 16px;
            display: inline-block;
        }
        
        .p-item.active .p-item-counter::before {
            content: "▶";
            color: var(--accent);
        }

        .p-item:last-child { border-bottom: none; }
        
        .p-item-title {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1;
            color: #fff;
        }

        .queue-icon {
            opacity: 0;
            color: var(--text-sub);
            font-size: 0.8rem;
            padding: 4px;
        }
        .p-item:hover .queue-icon { opacity: 1; }

        @media (max-width: 600px) {
            #music-player { left: 10px; bottom: 10px; }
            #vol-slider { display: none; }
        }
    </style>
</head>
<body>

    <div id="music-player">
        
        <div class="player-body">
            <img id="album-art" src="" alt="Art">
            
            <div class="track-info">
                <div id="track-title">Loading...</div>
                <div id="track-artist">...</div>
            </div>

            <div class="controls">
                <button id="btn-prev" title="Previous"><i class="fas fa-backward"></i></button>
                <button id="btn-play" title="Play/Pause"><i class="fas fa-play"></i></button>
                <button id="btn-next" title="Next"><i class="fas fa-forward"></i></button>
                <button id="btn-list" title="Playlist"><i class="fas fa-list"></i></button>
                <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.5" title="Volume">
            </div>
        </div>

        <button id="toggle-btn" title="Toggle Player">
            <i class="fas fa-chevron-left"></i>
        </button>

        <div id="playlist-modal">
            <div id="playlist-list"></div>
        </div>

    </div>

    <audio id="audio-el" crossOrigin="anonymous"></audio>

                { title: 'PRIDE.', artist: 'Kendrick Lamar', url: 'https://od.lk/s/OTdfMTAzNjE1OTU3Xw/Kendrick%20Lamar%20-%20PRIDE..mp3', cover: 'https://t2.genius.com/unsafe/344x344/https%3A%2F%2Fimages.genius.com%2Ff3f77222e1b615e0a10354ea6282ff22.1000x1000x1.png' },
                { title: 'A New Kind of Love', artist: 'Frou Frou', url: 'https://od.lk/s/OTdfMTAzNjIwODc2Xw/Frou%20Frou%20-%20A%20New%20Kind%20of%20Love%20%28Lyrics%29%20%20Are%20ya%20falling%20in%20love%20%20I%27ve%20a%20feeling%20you%20are.mp3', cover: 'https://t2.genius.com/unsafe/344x344/https%3A%2F%2Fimages.genius.com%2Ffb07c9940ab13f5aeebcfcbaa553a5ab.1000x1000x1.jpg' },
            ];

            let state = { idx: 0, isPlaying: false, queuedTracks: [] };

            const els = {
                player: document.getElementById('music-player'),
                audio: document.getElementById('audio-el'),
                art: document.getElementById('album-art'),
                title: document.getElementById('track-title'),
                artist: document.getElementById('track-artist'),
                playBtn: document.getElementById('btn-play'),
                prevBtn: document.getElementById('btn-prev'),
                nextBtn: document.getElementById('btn-next'),
                listBtn: document.getElementById('btn-list'),
                toggleBtn: document.getElementById('toggle-btn'),
                volSlider: document.getElementById('vol-slider'),
                modal: document.getElementById('playlist-modal'),
                list: document.getElementById('playlist-list')
            };

            function init() {
                if(!els.audio) return;
                renderPlaylist();
                loadTrack(0, false);
                setupEvents();
            }

            function loadTrack(index, playNow) {
                if(index < 0) index = songs.length - 1;
                if(index >= songs.length) index = 0;
                
                state.idx = index;
                const song = songs[index];
                
                const qIndex = state.queuedTracks.indexOf(song.url);
                if (qIndex !== -1) {
                    state.queuedTracks.splice(qIndex, 1);
                }
                
                if(els.title) {
                    els.title.classList.remove('overflowing');
                    els.title.style.removeProperty('--overflow-width');
                    els.title.textContent = song.title;
                    requestAnimationFrame(() => {
                        if (els.title.scrollWidth > els.title.parentElement.offsetWidth) {
                            els.title.classList.add('overflowing');
                            const diff = els.title.scrollWidth - els.title.parentElement.offsetWidth + 10;
                            els.title.style.setProperty('--overflow-width', `-${diff}px`);
                        }
                    });
                }
                
                if(els.artist) els.artist.textContent = song.artist;
                if(els.art) els.art.src = song.cover;
                if(els.audio) els.audio.src = song.url;

                renderPlaylist(); 

                if(playNow && els.audio) {
                    const playPromise = els.audio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                state.isPlaying = true;
                                updatePlayIcon();
                            })
                            .catch(() => {
                                state.isPlaying = false;
                                updatePlayIcon();
                            });
                    }
                }
                updateMediaSession(song);
            }

            function updatePlayIcon() {
                if(!els.playBtn) return;
                els.playBtn.innerHTML = state.isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            }

            function togglePlay() {
                if(!els.audio) return;
                if(els.audio.paused) {
                    const playPromise = els.audio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => { state.isPlaying = true; updatePlayIcon(); })
                            .catch(() => {});
                    }
                } else {
                    els.audio.pause();
                    state.isPlaying = false;
                    updatePlayIcon();
                }
            }

            function updateToggleIcon() {
                if(!els.toggleBtn || !els.player) return;
                const isHidden = els.player.classList.contains('hidden');
                els.toggleBtn.innerHTML = isHidden ? '<i class="fas fa-chevron-right"></i>' : '<i class="fas fa-chevron-left"></i>';
            }

            function renderPlaylist() {
                if(!els.list) return;
                els.list.innerHTML = '';
                
                const counts = JSON.parse(localStorage.getItem('lite_play_counts') || '{}');
                
                songs.forEach((s, i) => {
                    const el = document.createElement('div');
                    el.className = `p-item ${i === state.idx ? 'active' : ''}`;
                    
                    const playCountHtml = counts[s.url] >= 3 ? `<span style="margin-left:6px;font-size:0.8rem;">🔥</span>` : '';
                    
                    const qIndex = state.queuedTracks.indexOf(s.url);
                    let queueIconHtml = '';
                    if (qIndex !== -1) {
                        queueIconHtml = `<div class="queue-icon queued-badge" style="background:var(--accent); color:var(--bg-color); border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:bold; cursor:pointer; opacity:1;">${qIndex + 1}</div>`;
                    } else if (i !== state.idx) {
                        queueIconHtml = `<i class="fas fa-level-down-alt queue-icon" title="Play Next"></i>`;
                    }
                    
                    el.innerHTML = `
                        <div class="p-item-bg" style="background-image: url('${s.cover}')"></div>
                        <div class="p-item-content">
                            <div class="p-item-counter"></div>
                            <div class="p-item-title">${s.title}${playCountHtml}</div>
                            ${queueIconHtml}
                        </div>
                    `;
                    
                    el.onclick = (e) => {
                        if (e.target.closest('.queue-icon')) {
                            e.stopPropagation();
                            if (qIndex !== -1) {
                                state.queuedTracks.splice(qIndex, 1);
                            } else {
                                state.queuedTracks.push(s.url);
                            }
                            renderPlaylist();
                        } else {
                            loadTrack(i, true);
                            if(els.modal) els.modal.classList.remove('show');
                        }
                    };
                    els.list.appendChild(el);
                });
            }

            function updateMediaSession(song) {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: song.title,
                        artist: song.artist,
                        artwork: [{ src: song.cover, sizes: '96x96', type: 'image/jpeg' }]
                    });
                    navigator.mediaSession.setActionHandler('play', togglePlay);
                    navigator.mediaSession.setActionHandler('pause', togglePlay);
                    navigator.mediaSession.setActionHandler('previoustrack', () => loadTrack(state.idx - 1, true));
                    navigator.mediaSession.setActionHandler('nexttrack', () => loadTrack(state.idx + 1, true));
                }
            }

            function playNext() {
                if (state.queuedTracks.length > 0) {
                    const nextUrl = state.queuedTracks.shift();
                    const nextIndex = songs.findIndex(t => t.url === nextUrl);
                    if (nextIndex !== -1) {
                        loadTrack(nextIndex, true);
                        return;
                    }
                }
                loadTrack(state.idx + 1, true);
            }

            function setupEvents() {
                if(els.playBtn) els.playBtn.onclick = togglePlay;
                if(els.prevBtn) els.prevBtn.onclick = () => loadTrack(state.idx - 1, true);
                if(els.nextBtn) els.nextBtn.onclick = playNext;
                
                if(els.listBtn) els.listBtn.onclick = () => {
                    if(els.modal) els.modal.classList.toggle('show');
                };
                
                if(els.toggleBtn) els.toggleBtn.onclick = () => {
                    if(els.player) {
                        els.player.classList.toggle('hidden');
                        updateToggleIcon();
                        if(els.player.classList.contains('hidden') && els.modal) {
                            els.modal.classList.remove('show');
                        }
                    }
                };
                
                if(els.volSlider) {
                    els.volSlider.oninput = (e) => {
                        if(els.audio) els.audio.volume = e.target.value;
                    };
                }

                if(els.audio) {
                    els.audio.onended = () => {
                        const counts = JSON.parse(localStorage.getItem('lite_play_counts') || '{}');
                        counts[songs[state.idx].url] = (counts[songs[state.idx].url] || 0) + 1;
                        localStorage.setItem('lite_play_counts', JSON.stringify(counts));
                        
                        playNext();
                    };
                }

                document.addEventListener('keydown', (e) => {
                    if(e.code === 'Space') { e.preventDefault(); togglePlay(); }
                });
            }

            init();
        });
    </script>
